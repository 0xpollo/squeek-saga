[project]
name = "squeek-saga"
version = "0.1.0"
description = "A shared Discord saga that Squeektoshi, the Squeekchain hamster, moves forward. Unofficial community project, Sepolia testnet only."
requires-python = ">=3.12"
dependencies = [
    "web3>=7,<8",
    "discord.py>=2.4,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "anthropic>=0.60",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["squeek_saga"]

[tool.setuptools.package-data]
squeek_saga = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:websockets.*"]
